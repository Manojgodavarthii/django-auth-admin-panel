{% extends 'base.html' %}

{% block content %}
<div class="container">

    <h1>
        Edit User
    </h1>

    <p>
        Editing:
        <strong>
            {{ user.name }}
        </strong>
    </p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Update User
        </button>
    </form>

    <br>

    <a href="{% url 'admin_home' %}">
        Back to Dashboard
    </a>

</div>
{% endblock %}
